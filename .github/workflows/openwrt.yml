name: OpenWrt Packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    name: OpenWrt ${{ matrix.series }} ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        series: ['24.10', '25.12']
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Identity is the PR's exact source commit, as in the other gates.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl
      - name: Restore OpenWrt build cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/openwrt/cargo-target
            ${{ runner.temp }}/openwrt/*.tar.zst
            ${{ runner.temp }}/openwrt/vm/*.bin
            ${{ runner.temp }}/openwrt/vm/*.img.gz
          key: openwrt-v1-${{ matrix.series }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'scripts/openwrt/targets.json') }}-${{ github.sha }}
          restore-keys: openwrt-v1-${{ matrix.series }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'scripts/openwrt/targets.json') }}-
      - name: Install SDK and VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd qemu-system-arm qemu-system-x86 e2fsprogs openssh-client
      - name: Resolve candidate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version = "([^"]+)"', Path('Cargo.toml').read_text(), re.M).group(1)
          tag = os.environ.get('RELEASE_TAG') or f'v{version}'
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'P2WLAN_OPENWRT_TAG={tag}\n')
          PY
      - name: Compile static musl binaries
        run: >
          python3 scripts/openwrt/build.py --stage compile
          --series '${{ matrix.series }}' --arch '${{ matrix.arch }}'
          --tag "$P2WLAN_OPENWRT_TAG"
          --work-dir "$RUNNER_TEMP/openwrt"
          --output dist-release
      - name: Assemble native SDK packages
        run: >
          python3 scripts/openwrt/build.py --stage package
          --series '${{ matrix.series }}' --arch '${{ matrix.arch }}'
          --tag "$P2WLAN_OPENWRT_TAG"
          --work-dir "$RUNNER_TEMP/openwrt"
          --output dist-release
      - name: Install and verify on matching OpenWrt kernel
        run: >
          python3 scripts/openwrt/build.py --stage verify
          --series '${{ matrix.series }}' --arch '${{ matrix.arch }}'
          --tag "$P2WLAN_OPENWRT_TAG"
          --work-dir "$RUNNER_TEMP/openwrt"
          --output dist-release
      - name: Save OpenWrt build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/openwrt/cargo-target
            ${{ runner.temp }}/openwrt/*.tar.zst
            ${{ runner.temp }}/openwrt/vm/*.bin
            ${{ runner.temp }}/openwrt/vm/*.img.gz
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload verified package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-openwrt-${{ matrix.series }}-${{ matrix.arch }}
          if-no-files-found: error
          path: dist-release/p2wlan-openwrt-*
      - name: Upload VM verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openwrt-verification-${{ matrix.series }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/openwrt/vm/verification.json
            ${{ runner.temp }}/openwrt/vm/failure.json
            ${{ runner.temp }}/openwrt/vm/service-diagnostics.log
            ${{ runner.temp }}/openwrt/vm/console.log

  required:
    name: OpenWrt Packages Required
    if: always()
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native package and VM scenario
        env:
          RESULT: ${{ needs.packages.result }}
        run: test "$RESULT" = success
