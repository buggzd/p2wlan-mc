name: Minecraft Mod Build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-mod-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: Mod source checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Verify repository contracts
        env:
          P2WLAN_QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/docs/verify_repository.py
          python3 scripts/quality/check_code_health.py
          python3 -m unittest discover -s scripts/quality/tests -p 'test_*.py'
          bash -n scripts/install-server.sh scripts/deploy-server.sh scripts/p2wlan-server
      - name: Test Mod build and archive contracts
        run: python3 -m unittest discover -s minecraft-mod/tests -p 'test_*.py'
      - name: Test shared Java components
        run: python3 minecraft-mod/tools/java.py test

  native:
    name: Native agent (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: macos-14
            platform: macos-aarch64
    steps:
      # Native source digests hash exact bytes. Keep Windows checkout content
      # identical to the Linux/macOS checkout used by the final JAR verifier.
      - name: Keep source bytes identical on every runner
        run: git config --global core.autocrlf false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Test independent native workspace
        run: python minecraft-mod/tools/native.py test --workspace --locked
      - name: Build and execute source-bound native agent
        run: python minecraft-mod/tools/native_bundle.py --target ${{ matrix.platform }}
      - name: Upload verified native resources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mod-native-${{ matrix.platform }}-${{ github.sha }}
          path: minecraft-mod/java/native-bundle/build/generatedResources/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package:
    name: Universal JAR and HMCL packs
    needs: [checks, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install game and Forge build toolchains
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            8
            17
            25
            21
      - name: Download all verified native resources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mod-native-*-${{ github.sha }}
          merge-multiple: true
          path: minecraft-mod/java/native-bundle/build/generatedResources/
      - name: Require the complete native target set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          directory = Path('minecraft-mod/java/native-bundle/build/generatedResources/p2wlan/native')
          expected = {'windows-x86_64', 'linux-x86_64', 'macos-aarch64'}
          actual = {path.name for path in directory.iterdir()}
          if actual != expected:
              raise SystemExit('native artifact platform set mismatch')
          PY
      - name: Build and verify every published Minecraft and loader profile
        env:
          P2WLAN_LEGACY_JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          P2WLAN_FORGE_JAVA25_HOME: ${{ env.JAVA_HOME_25_X64 }}
          P2WLAN_FORGE_JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          P2WLAN_FORGE1165_MCP_JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: python3 minecraft-mod/tools/java.py universal-build --output minecraft-mod/dist/p2wlan-universal.jar
      - name: Package Windows HMCL profiles and write source-bound checksums
        run: |
          python3 minecraft-mod/tools/distribution.py \
            --mod minecraft-mod/dist/p2wlan-universal.jar \
            --platform windows-x86_64 --download-fabric-api
          cd minecraft-mod/dist
          sha256sum --check SHA256SUMS
      - name: Upload player distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-minecraft-mod-${{ github.sha }}
          path: minecraft-mod/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
