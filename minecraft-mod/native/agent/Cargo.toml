[package]
name = "p2wlan-mc-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p2wlan-mc-protocol = { path = "../protocol" }
p2wlan-mc-runtime-port = { path = "../runtime-port" }
p2wlan-mc-gateway = { path = "../gateway" }
tokio.workspace = true
serde_json = "1"
getrandom = "=0.2.17"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
p2wlan-mc-private-windows = { path = "../private-windows" }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
