plugins { id 'application' }

application {
    mainClass = 'io.p2wlan.mc.account.AccountTool'
    applicationName = 'p2wlan-account'
}
dependencies {
    implementation project(':common')
    runtimeOnly project(':native-bundle')
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
// Unit tests deliberately exclude bundled native resources: input/schema tests
// cannot launch a helper accidentally or pass because a local bundle exists.
tasks.register('accountTest', JavaExec) {
    dependsOn testClasses, ':common:classes'
    classpath = files(provider { sourceSets.test.output + sourceSets.main.output + project(':common').sourceSets.main.runtimeClasspath })
    mainClass = 'io.p2wlan.mc.account.AccountToolTests'
}
check.dependsOn accountTest

distributions.main.distributionBaseName = 'p2wlan-account'
// Installed launchers and the zip must contain identical, source-bound native
// resources. No development bundle is silently admitted into a release build.
tasks.register('verifyAccountDistribution', Exec) {
    dependsOn installDist, distZip
    doFirst {
        commandLine 'python3', rootProject.file('../tools/verify_account_dist.py'),
                tasks.named('installDist').get().destinationDir,
                '--zip', tasks.named('distZip').get().archiveFile.get().asFile
        if (providers.gradleProperty('developmentNative').isPresent()) args '--development'
    }
}
