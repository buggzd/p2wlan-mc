pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        if (providers.gradleProperty('neoforgeAdapter').isPresent()) {
            maven { url = 'https://maven.neoforged.net/releases/' }
        }
        gradlePluginPortal()
    }
}
rootProject.name = 'p2wlan-minecraft'
include 'common'
include 'netty-transport'

include 'native-bundle'
include 'account-cli'

// Loader builds are opt-in, so common protocol tests never fetch Minecraft or
// load Loom. New loader/version adapters remain independent subprojects.
if (providers.gradleProperty('fabricAdapter').isPresent()) {
    include 'fabric'
    project(':fabric').projectDir = file('adapters/fabric-1.21.1')
}

if (providers.gradleProperty('neoforgeAdapter').isPresent()) {
    include 'neoforge'
    project(':neoforge').projectDir = file('adapters/neoforge-1.21.1')
}
