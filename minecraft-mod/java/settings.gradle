pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        if (providers.gradleProperty('neoforgeAdapter').isPresent()) {
            maven { url = 'https://maven.neoforged.net/releases/' }
        }
        gradlePluginPortal()
    }
}
rootProject.name = 'p2wlan-minecraft'
include 'common'
include 'netty-transport'
include 'universal-bootstrap'

include 'native-bundle'
include 'account-cli'

// Loader builds are opt-in, so common protocol tests never fetch Minecraft or
// load Loom. New loader/version adapters remain independent subprojects.
if (providers.gradleProperty('fabricAdapter').isPresent()) {
    include 'fabric'
    project(':fabric').projectDir = file('adapters/fabric-1.21.1')
}

if (providers.gradleProperty('fabricLegacyAdapter').isPresent()) {
    include 'fabric-legacy'
    project(':fabric-legacy').projectDir = file('adapters/fabric-1.20.1')
}

// SDK input only until the profile's installed-archive contract is verified.
if (providers.gradleProperty('fabric1182Adapter').isPresent()) {
    include 'fabric-1182'
    project(':fabric-1182').projectDir = file('adapters/fabric-1.18.2')
}

if (providers.gradleProperty('fabric1165Adapter').isPresent()) {
    include 'fabric-1165'
    project(':fabric-1165').projectDir = file('adapters/fabric-1.16.5')
}

if (providers.gradleProperty('neoforgeAdapter').isPresent()) {
    include 'neoforge'
    project(':neoforge').projectDir = file('adapters/neoforge-1.21.1')
}
