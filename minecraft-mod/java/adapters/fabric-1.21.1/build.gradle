plugins { id 'fabric-loom' version '1.10.5' }

base { archivesName = 'p2wlan-fabric-1.21.1' }
def fabricApiVersion = '0.116.7+1.21.1'
configurations {
    hmclFabricApi { canBeConsumed = false; canBeResolved = true; transitive = false }
}
def developmentEnabled = providers.gradleProperty('developmentNative').map { value ->
    value.isEmpty() || value == 'true'
}.getOrElse(false)
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    hmclFabricApi "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    include 'net.java.dev.jna:jna:5.14.0'
    implementation project(':common')
    include project(':common')
    implementation project(':netty-transport')
    include project(':netty-transport')
    implementation project(':native-bundle')
    include project(':native-bundle')
}
loom {
    splitEnvironmentSourceSets()
    mods {
        p2wlan {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
sourceSets.client.java.srcDir rootProject.file('game-1.21.1/src/client/java')
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('verifyModJar', Exec) {
    dependsOn remapJar
    doFirst {
        commandLine 'python3', rootProject.file('../tools/verify_mod_jar.py'),
                tasks.named('remapJar').get().archiveFile.get().asFile
        if (developmentEnabled) args '--development'
    }
}
check.dependsOn verifyModJar

// Explicit development opt-in is also forwarded to Loom's development JVMs;
// it never changes the packaged runtime default or Minecraft's EULA/account.
if (developmentEnabled) {
    loom.runs.configureEach { vmArg '-Dp2wlan.allowDevelopmentNative=true' }
}

tasks.register('worldTransportTest') { dependsOn ':netty-transport:worldTransportTest' }
check.dependsOn worldTransportTest

tasks.register('joinTransportTest') { dependsOn ':netty-transport:joinTransportTest' }
check.dependsOn joinTransportTest

tasks.register('clientBootstrapTest') { dependsOn ':netty-transport:clientBootstrapTest' }
check.dependsOn clientBootstrapTest

// Test-only source set/mod/run. It is absent from every ordinary build and run,
// never included/remapped into the production artifact or enabled by default.
if (providers.gradleProperty('clientHookFixture').isPresent()) {
    def fixture = sourceSets.create('clientFixture')
    fixture.java.srcDir rootProject.file('game-1.21.1/src/clientFixture/java')
    fixture.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    fixture.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    loom.mods.register('p2wlan_client_hook_test') { sourceSet fixture }
    loom.runs.register('clientFixture') {
        inherit loom.runs.client
        name 'P2WLAN isolated client hook fixture'
        source fixture
        runDir providers.gradleProperty('clientFixtureDirectory').get()
        property 'p2wlan.fixture.run', providers.gradleProperty('clientFixtureRun').get()
        property 'p2wlan.fixture.result', providers.gradleProperty('clientFixtureResult').get()
        ideConfigGenerated false
    }
}

// Dedicated world fixture is opt-in and absent from ordinary jars/runs. The
// wrapper requires an already accepted EULA and an explicit loopback test run.
if (providers.gradleProperty('serverBootFixture').isPresent()) {
    def fixture = sourceSets.create('serverFixture')
    fixture.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    fixture.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    loom.mods.register('p2wlan_server_boot_test') { sourceSet fixture }
    loom.runs.register('serverFixture') {
        inherit loom.runs.server
        name 'P2WLAN isolated dedicated world fixture'
        source fixture
        runDir providers.gradleProperty('serverFixtureDirectory').get()
        property 'p2wlan.fixture.run', providers.gradleProperty('serverFixtureRun').get()
        property 'p2wlan.fixture.result', providers.gradleProperty('serverFixtureResult').get()
        ideConfigGenerated false
    }
}

// Real local gameplay is a separate explicit test mod, never a production
// entrypoint. The wrapper owns fresh accounts, Control and disposable worlds.
if (providers.gradleProperty('localGameFixture').isPresent()) {
    def server = sourceSets.create('localGameFixture')
    server.java.srcDir rootProject.file('game-1.21.1/src/localGameFixture/java')
    server.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    server.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    def client = sourceSets.create('localGameClientFixture')
    client.java.srcDir rootProject.file('game-1.21.1/src/localGameClientFixture/java')
    client.compileClasspath += server.output + sourceSets.client.output + sourceSets.client.compileClasspath
    client.runtimeClasspath += server.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    loom.mods.register('p2wlan_local_game_test') { sourceSet server; sourceSet client }
    loom.runs.register('localGameServer') {
        inherit loom.runs.server
        source server
        runDir providers.gradleProperty('localGameServerDirectory').get()
        property 'p2wlan.gameFixture.config', providers.gradleProperty('localGameServerConfig').get()
        ideConfigGenerated false
    }
    loom.runs.register('localGameClient') {
        inherit loom.runs.client
        source client
        runDir providers.gradleProperty('localGameClientDirectory').get()
        property 'p2wlan.gameFixture.config', providers.gradleProperty('localGameClientConfig').get()
        ideConfigGenerated false
    }
}

// Argument order is not a task dependency. Never start an ordinary/fixture JVM
// before the source-bound production archive check has actually succeeded.
tasks.matching { it.name in ['runServer', 'runClient', 'runClientFixture', 'runServerFixture', 'runLocalGameServer', 'runLocalGameClient'] }.configureEach {
    dependsOn tasks.named('verifyModJar')
}

// HMCL accepts a CurseForge-format ZIP with a Fabric loader entry. This task
// copies only the verified release Mod and exact official API artifact, never
// run directories, game files, Java, launch/session data or account profiles.
tasks.register('buildHmclPack', Exec) {
    dependsOn tasks.named('verifyModJar')
    doFirst {
        def platform = providers.gradleProperty('hmclPlatform').getOrElse('')
        if (!(platform in ['macos-aarch64', 'macos-x86_64', 'linux-aarch64', 'linux-x86_64', 'windows-x86_64'])) {
            throw new GradleException('Specify -PhmclPlatform with an exact native target')
        }
        if (developmentEnabled) throw new GradleException('HMCL packs require release native resources')
        def output = layout.buildDirectory.dir('distributions').get().asFile
        output.mkdirs()
        commandLine 'python3', rootProject.file('../tools/hmcl_pack.py'), 'build',
                '--mod', tasks.named('remapJar').get().archiveFile.get().asFile,
                '--fabric-api', configurations.hmclFabricApi.singleFile,
                '--platform', platform,
                '--output', new File(output, "p2wlan-hmcl-fabric-1.21.1-${platform}-${project.version}.zip")
    }
}
