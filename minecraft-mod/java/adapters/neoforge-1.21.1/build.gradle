plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
base { archivesName = 'p2wlan-neoforge-1.21.1' }
def installedArchive = providers.gradleProperty('installedModArchive')
def externalInstalled = installedArchive.isPresent()
def installedFixture = providers.gradleProperty('serverInstalledFixture').isPresent() || externalInstalled
if (providers.gradleProperty('serverInstalledFixture').isPresent() && !providers.gradleProperty('serverBootFixture').isPresent()) {
    throw new GradleException('NEOFORGE_INSTALLED_FIXTURE_REQUIRES_SERVER_FIXTURE')
}
if (externalInstalled && !providers.gradleProperty('localGameFixture').isPresent()) {
    throw new GradleException('NEOFORGE_INSTALLED_FIXTURE_REQUIRES_LOCAL_GAME_FIXTURE')
}
def developmentEnabled = providers.gradleProperty('developmentNative').map { value ->
    value.isEmpty() || value == 'true'
}.getOrElse(false)
sourceSets.main.java.srcDir rootProject.file('game-1.21.1/src/server/java')
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
sourceSets.main.java.srcDir rootProject.file('game-1.21.1/src/client/java')
sourceSets.main.java.srcDir rootProject.file('game-api-1.21.1/src/client/java')
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.named('compileJava', JavaCompile) { options.release = 17 }
// The JDK-21 compiler reads this exact game's Java-21 SDK while emitting
// portable Java-17 classes. Compile and runtime dependency selection use the
// game's Java-21 SDK rather than the emitted class-file target.
configurations.matching {
    it.name in ['compileClasspath', 'runtimeClasspath'] ||
            it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath')
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}
neoForge {
    version = '21.1.256'
    runs {
        server {
            server()
            programArgument '--nogui'
        }
        client { client() }
        configureEach {
            if (developmentEnabled) {
                systemProperty 'p2wlan.allowDevelopmentNative', 'true'
            }
        }
    }
    mods {
        p2wlan { sourceSet sourceSets.main }
    }
}
dependencies {
    implementation project(':common')
    implementation project(':universal-bootstrap')
    implementation project(':netty-transport')
    if (!externalInstalled) implementation project(':native-bundle')
    // NeoForge 1.21.1 ignores plain libraries on the ordinary development
    // classpath. JarJar handles installed mods; development runs need this
    // explicit legacy classpath as well (including transitive IPC/JNA inputs).
    if (!installedFixture) {
        additionalRuntimeClasspath project(':universal-bootstrap')
        additionalRuntimeClasspath project(':common')
        additionalRuntimeClasspath project(':netty-transport')
        additionalRuntimeClasspath project(':native-bundle')
    }
    // Portable implementation/resources are identical to Fabric, not a fork.
    jarJar project(':common')
    jarJar project(':netty-transport')
    jarJar project(':native-bundle')
    // This pinned Minecraft/NeoForge runtime already provides JNA 5.14.0 in
    // its bootstrap layer. A second named JNA module prevents layer resolution.
}
// ModDev's game/bootstrap API is supplied to main; the policy harness uses
// that same SDK rather than an independent, mismatched dependency graph.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
tasks.register('resourcePolicyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.neoforge.LocalNativeResourcesTests'
    // SecureJarHandler uses this same lookup access in the game launcher.
    // This opens only the standalone policy-test JVM, not production runs.
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
}
check.dependsOn resourcePolicyTest
// Stable named resource module: it contains no class/package for a classloader
// lookup to discover. Installed native reads select this exact local module.
project(':native-bundle').tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'io.p2wlan.mc.nativebundle')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    from { project(':universal-bootstrap').sourceSets.main.output.classesDirs }
}

// Every game run depends on the same production archive check, including the
// test-only server fixture. Ordinary task ordering is not sufficient.
tasks.register('verifyModJar', Exec) {
    if (!externalInstalled) dependsOn jar
    doFirst {
        commandLine 'python3', rootProject.file(externalInstalled ? '../tools/universal_jar.py' : '../tools/verify_neoforge_jar.py'),
                *(externalInstalled ? ['verify', installedArchive.get()] : [tasks.named('jar').get().archiveFile.get().asFile])
        if (developmentEnabled) args '--development'
    }
}

def installedRuntime = { fixture, extra ->
    def runtime = configurations[sourceSets.main.runtimeClasspathConfigurationName].incoming.artifactView {
        componentFilter { identity ->
            !(identity instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && identity.projectPath in [':common', ':netty-transport', ':native-bundle', ':universal-bootstrap'])
        }
    }.files
    fixture.runtimeClasspath = fixture.output + extra + runtime
}
check.dependsOn verifyModJar
tasks.register('buildHmclPack', Exec) {
    dependsOn tasks.named('verifyModJar')
    doFirst {
        def platform = providers.gradleProperty('hmclPlatform').getOrElse('')
        if (!(platform in ['macos-aarch64', 'macos-x86_64', 'linux-aarch64', 'linux-x86_64', 'windows-x86_64'])) {
            throw new GradleException('Specify -PhmclPlatform with an exact native target')
        }
        if (developmentEnabled) throw new GradleException('HMCL packs require release native resources')
        def output = layout.buildDirectory.dir('distributions').get().asFile
        output.mkdirs()
        commandLine 'python3', rootProject.file('../tools/hmcl_pack.py'), 'build',
                '--loader', 'neoforge', '--mod', tasks.named('jar').get().archiveFile.get().asFile,
                '--platform', platform,
                '--output', new File(output, "p2wlan-hmcl-neoforge-1.21.1-${platform}-${project.version}.zip")
    }
}
tasks.matching { it.name in ['runServer', 'runClient', 'runServerFixture', 'runClientFixture', 'runLocalGameServer', 'runLocalGameClient', 'runIntegratedHost'] }.configureEach {
    dependsOn tasks.named('verifyModJar')
}

// Opt-in test mod/source set, excluded from the production jar and ordinary
// runs. The wrapper owns a fresh loopback/offline world and requires consent.
if (providers.gradleProperty('serverBootFixture').isPresent()) {
    def fixture = sourceSets.create('serverFixture')
    fixture.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    fixture.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods.register('p2wlan_server_boot_test') { sourceSet fixture }
    neoForge.runs.register('serverFixture') {
        server()
        sourceSet = fixture
        // Installed mode discovers the production archive from game/mods;
        // neither production source outputs nor a legacy-library fallback
        // may make this JarJar acceptance pass.
        loadedMods = installedFixture ? [neoForge.mods.p2wlan_server_boot_test] :
                [neoForge.mods.p2wlan, neoForge.mods.p2wlan_server_boot_test]
        systemProperty 'p2wlan.fixture.installation', installedFixture ? 'jarjar' : 'development'
        gameDirectory = file(providers.gradleProperty('serverFixtureDirectory').get())
        programArgument '--nogui'
        systemProperty 'p2wlan.fixture.run', providers.gradleProperty('serverFixtureRun').get()
        systemProperty 'p2wlan.fixture.result', providers.gradleProperty('serverFixtureResult').get()
        if (developmentEnabled) {
            systemProperty 'p2wlan.allowDevelopmentNative', 'true'
        }
        disableIdeRun()
    }
}

// Both loaders execute these exact shared Minecraft assertions. No fixture
// source is added to production or ordinary runs.
if (providers.gradleProperty('clientHookFixture').isPresent()) {
    def fixture = sourceSets.create('clientFixture')
    fixture.java.srcDir rootProject.file('game-1.21.1/src/clientFixture/java')
    fixture.java.srcDir rootProject.file('game-api-1.21.1/src/fixture/java')
    fixture.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    fixture.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods.register('p2wlan_client_hook_test') { sourceSet fixture }
    neoForge.runs.register('clientFixture') {
        client()
        sourceSet = fixture
        gameDirectory = file(providers.gradleProperty('clientFixtureDirectory').get())
        systemProperty 'p2wlan.fixture.run', providers.gradleProperty('clientFixtureRun').get()
        systemProperty 'p2wlan.fixture.result', providers.gradleProperty('clientFixtureResult').get()
        if (developmentEnabled) systemProperty 'p2wlan.allowDevelopmentNative', 'true'
        disableIdeRun()
    }
}

if (providers.gradleProperty('localGameFixture').isPresent()) {
    def gameServer = sourceSets.create('localGameFixture')
    gameServer.java.srcDir rootProject.file('game-1.21.1/src/localGameFixture/java')
    gameServer.java.srcDir rootProject.file('game-1.21.1/src/fixtureCommon/java')
    gameServer.java.srcDir layout.projectDirectory.dir('src/fixtureCommon/java')
    gameServer.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    if (externalInstalled) installedRuntime(gameServer, files())
    else gameServer.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    def gameClient = sourceSets.create('localGameClientFixture')
    gameClient.java.srcDir rootProject.file('game-1.21.1/src/localGameClientFixture/java')
    gameClient.java.srcDir rootProject.file('game-api-1.21.1/src/fixture/java')
    gameClient.compileClasspath += gameServer.output + sourceSets.main.output + sourceSets.main.compileClasspath
    if (externalInstalled) installedRuntime(gameClient, gameServer.output)
    else gameClient.runtimeClasspath += gameServer.output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods.register('p2wlan_local_game_test') { sourceSet gameServer; sourceSet gameClient }
    neoForge.runs.register('localGameServer') {
        server()
        sourceSet = gameServer
        if (externalInstalled) loadedMods = [neoForge.mods.p2wlan_local_game_test]
        gameDirectory = file(providers.gradleProperty('localGameServerDirectory').get())
        systemProperty 'p2wlan.gameFixture.config', providers.gradleProperty('localGameServerConfig').get()
        if (externalInstalled) {
            systemProperty 'p2wlan.gameFixture.installedArchive', providers.gradleProperty('localGameInstalledArchive').get()
            systemProperty 'p2wlan.gameFixture.installedSha256', providers.gradleProperty('localGameInstalledSha256').getOrElse('')
        }
        if (developmentEnabled) systemProperty 'p2wlan.allowDevelopmentNative', 'true'
        programArgument '--nogui'
        disableIdeRun()
    }
    neoForge.runs.register('localGameClient') {
        client()
        sourceSet = gameClient
        if (externalInstalled) loadedMods = [neoForge.mods.p2wlan_local_game_test]
        gameDirectory = file(providers.gradleProperty('localGameClientDirectory').get())
        systemProperty 'p2wlan.gameFixture.config', providers.gradleProperty('localGameClientConfig').get()
        if (externalInstalled) {
            systemProperty 'p2wlan.gameFixture.installedArchive', providers.gradleProperty('localGameInstalledArchive').get()
            systemProperty 'p2wlan.gameFixture.installedSha256', providers.gradleProperty('localGameInstalledSha256').getOrElse('')
        }
        if (developmentEnabled) systemProperty 'p2wlan.allowDevelopmentNative', 'true'
        disableIdeRun()
    }
}

if (providers.gradleProperty('integratedGameFixture').isPresent()) {
    if (!providers.gradleProperty('localGameFixture').isPresent()) {
        throw new GradleException('INTEGRATED_FIXTURE_REQUIRES_LOCAL_GAME_FIXTURE')
    }
    def hostFixture=sourceSets.create('integratedFixture')
    hostFixture.java.srcDir rootProject.file('game-1.21.1/src/integratedFixture/java')
    hostFixture.java.srcDir rootProject.file('game-api-1.21.1/src/fixture/java')
    hostFixture.java.srcDir rootProject.file('game-1.21.1/src/fixtureCommon/java')
    hostFixture.java.srcDir layout.projectDirectory.dir('src/fixtureCommon/java')
    hostFixture.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    if (externalInstalled) installedRuntime(hostFixture, files())
    else hostFixture.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    neoForge.mods.register('p2wlan_integrated_test') { sourceSet hostFixture }
    neoForge.runs.register('integratedHost') {
        client()
        sourceSet=hostFixture
        loadedMods=externalInstalled ? [neoForge.mods.p2wlan_integrated_test] : [neoForge.mods.p2wlan,neoForge.mods.p2wlan_integrated_test]
        gameDirectory=file(providers.gradleProperty('localGameServerDirectory').get())
        systemProperty 'p2wlan.gameFixture.config',providers.gradleProperty('localGameServerConfig').get()
        if (externalInstalled) {
            systemProperty 'p2wlan.gameFixture.installedArchive', providers.gradleProperty('localGameInstalledArchive').get()
            systemProperty 'p2wlan.gameFixture.installedSha256', providers.gradleProperty('localGameInstalledSha256').getOrElse('')
        }
        if(developmentEnabled) systemProperty 'p2wlan.allowDevelopmentNative','true'
        programArgument '--username'
        programArgument 'IntegratedHost'
        disableIdeRun()
    }
    neoForge.runs.named('localGameClient') {
        loadedMods=externalInstalled ? [neoForge.mods.p2wlan_local_game_test] : [neoForge.mods.p2wlan,neoForge.mods.p2wlan_local_game_test]
        programArgument '--username'
        programArgument 'IntegratedGuest'
    }
}
