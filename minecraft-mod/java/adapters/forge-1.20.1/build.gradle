buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.47'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}
apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
base { archivesName = 'p2wlan-forge-1.20.1' }
def installedArchive = providers.gradleProperty('installedModArchive')
def externalInstalled = installedArchive.isPresent()
if (externalInstalled && !providers.gradleProperty('localGameFixture').isPresent()) {
    throw new GradleException('LEGACY_FORGE_INSTALLED_FIXTURE_REQUIRES_LOCAL_GAME_FIXTURE')
}
['common', 'netty-transport', 'native-bundle', 'universal-bootstrap'].each { evaluationDependsOn(':' + it) }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }

def game = rootProject.file('../game-1.21.1')
def modernEntry = rootProject.file('../adapters/forge-1.21.1/src/main/java/io/p2wlan/mc/forge')
def legacyMixin = 'io/p2wlan/mc/game/mixin/MultiplayerListMixin.java'
def generatedGame = layout.buildDirectory.dir('generated/sources/legacyGame')
def gameClient = sourceSets.create('gameClient')
sourceSets.main.java.srcDir new File(game, 'src/server/java')
sourceSets.main.java.exclude 'io/p2wlan/mc/forge/legacy/ForgeClientEvents.java'
gameClient.java.srcDirs new File(game, 'src/client/java'), layout.projectDirectory.dir('src/main/java'),
        rootProject.file('../game-api-1.20.1/src/client/java')
gameClient.java.include 'io/p2wlan/mc/game/**/*.java', 'io/p2wlan/mc/forge/legacy/ForgeClientEvents.java'
gameClient.java.exclude legacyMixin
configurations.gameClientImplementation.extendsFrom configurations.implementation
gameClient.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
gameClient.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

tasks.register('prepareLegacyGameSources', Exec) {
    inputs.file new File(game, 'src/client/java/' + legacyMixin)
    inputs.files rootProject.file('../../tools/game_sources.py'), rootProject.file('../../tools/source_contract.py')
    outputs.file generatedGame.map { it.file(legacyMixin) }
    commandLine 'python3', rootProject.file('../../tools/game_sources.py'), '--output', generatedGame.get().asFile
}
tasks.named('compileJava', JavaCompile) {
    // Only the version-neutral entry/interface cross the modern adapter boundary.
    source new File(modernEntry, 'ForgeP2wlan.java'), new File(modernEntry, 'ForgeRuntime.java')
}
tasks.named(gameClient.compileJavaTaskName, JavaCompile) {
    dependsOn tasks.named('prepareLegacyGameSources')
    source generatedGame.map { it.file(legacyMixin) }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory layout.projectDirectory.dir('run').asFile
            if (providers.gradleProperty('developmentNative').isPresent()) property 'p2wlan.allowDevelopmentNative', 'true'
            if (!externalInstalled) mods {
                p2wlan {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                    source project(':netty-transport').sourceSets.main
                    source project(':native-bundle').sourceSets.main
                    source project(':universal-bootstrap').sourceSets.main
                }
            }
        }
        client {
            if (!externalInstalled) mods { p2wlan { source gameClient } }
        }
        server { args '--nogui' }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.2'
    implementation project(':common')
    implementation project(':netty-transport')
    implementation project(':native-bundle')
    implementation project(':universal-bootstrap')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    gameClientAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    ['common', 'netty-transport', 'native-bundle'].each { portable ->
        jarJar(project(':' + portable)) {
            transitive = false
            jarJar.ranged(it, '[0.1.0,)')
        }
    }
}
jarJar.enable()
project(':native-bundle').plugins.withId('java') {
    project(':native-bundle').tasks.named('jar') {
        manifest.attributes('Automatic-Module-Name': 'io.p2wlan.mc.nativebundle')
    }
}
mixin {
    add sourceSets.main, 'p2wlan-forge-1.20.1-server-refmap.json'
    add gameClient, 'p2wlan-forge-1.20.1-client-refmap.json'
    config 'p2wlan.forge.1.20.1.mixins.json'
    config 'p2wlan.forge.1.20.1.client.mixins.json'
}
tasks.named('jar') {
    archiveClassifier = 'slim'
    from gameClient.output
    finalizedBy 'reobfJar'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    from gameClient.output
    finalizedBy 'reobfJarJar'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
def resourcePolicy = sourceSets.create('resourcePolicy')
configurations.resourcePolicyImplementation.extendsFrom configurations.implementation
resourcePolicy.compileClasspath += sourceSets.main.output
resourcePolicy.runtimeClasspath += sourceSets.main.output
tasks.register('resourcePolicyTest', JavaExec) {
    dependsOn resourcePolicy.classesTaskName
    classpath = resourcePolicy.runtimeClasspath
    mainClass = 'io.p2wlan.mc.forge.legacy.LocalNativeResourcesTests'
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
}
check.dependsOn resourcePolicyTest
tasks.register('verifyModJar', Exec) {
    if (!externalInstalled) dependsOn 'reobfJarJar'
    doFirst {
        commandLine 'python3', rootProject.file(externalInstalled ? '../../tools/universal_jar.py' : '../../tools/legacy_gradle.py'), 'verify',
                externalInstalled ? installedArchive.get() : tasks.named('jarJar').get().archiveFile.get().asFile
        if (providers.gradleProperty('developmentNative').isPresent()) args '--development'
    }
}
check.dependsOn verifyModJar

// Compile test mods against the named SDK. Production launchers install their
// separately reobfuscated archives alongside the unchanged Universal JAR.
def installedRuntime = { fixture ->
    def sdk = configurations[fixture.runtimeClasspathConfigurationName].incoming.artifactView {
        componentFilter { identity ->
            !(identity instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && identity.projectPath in [':common', ':netty-transport', ':native-bundle', ':universal-bootstrap'])
        }
    }.files
    fixture.runtimeClasspath = fixture.output + sdk
}
def installedFixture = { fixture, label, metadata, packMetadata ->
    def archive = layout.buildDirectory.file("installed-fixtures/${label}.jar")
    def directory = layout.buildDirectory.dir("installed-fixtures/${label}")
    def relocation = tasks.register("relocate${label}", Exec) {
        dependsOn tasks.named(fixture.classesTaskName)
        inputs.files(fixture.output.classesDirs)
        inputs.file(metadata)
        inputs.file(packMetadata)
        inputs.files(rootProject.file('../../tools/fixture_relocation.py'), rootProject.file('../../tools/class_relocation.py'))
        outputs.file(archive)
        doFirst {
            def selected = ['python3', rootProject.file('../../tools/fixture_relocation.py'), '--loader', 'forge', '--minecraft', '1.20.1']
            fixture.output.classesDirs.files.sort().each { selected += ['--classes', it] }
            selected += ['--metadata', metadata, '--pack-metadata', packMetadata, '--output', archive.get().asFile]
            commandLine selected
        }
    }
    def expanded = tasks.register("expand${label}", Sync) {
        dependsOn relocation
        from { zipTree(archive.get().asFile) }
        into directory
    }
    // The named input remains immutable; only this new output contains SRG
    // Minecraft references for the official installed runtime.
    tasks.register("reobfInstalled${label}", net.minecraftforge.gradle.userdev.tasks.RenameJar) {
        dependsOn relocation
        input.set(archive)
        output.set(layout.buildDirectory.file("installed-fixtures/${label}-srg.jar"))
        mappings.set(tasks.named('createMcpToSrg').flatMap { it.output })
        libraries.from(fixture.compileClasspath)
        args.add('--disable-abstract-param')
    }
    // FG6's MOD_CLASSES locator consumes output directories. These contain
    // the verified relocated fixture only, with no production source output.
    def runtime = sourceSets.create("installed${label}")
    runtime.output.classesDirs.setFrom(files(directory).builtBy(expanded))
    runtime.output.resourcesDir = directory.get().asFile
    runtime.runtimeClasspath = runtime.output + (fixture.runtimeClasspath - fixture.output)
    tasks.named(runtime.classesTaskName) { dependsOn expanded }
    return runtime
}
def bindFixture = { run, fixture, directory, config ->
    run.workingDirectory file(directory)
    run.setSources([fixture])
    run.property 'p2wlan.gameFixture.config', config
    if (externalInstalled) {
        run.property 'p2wlan.gameFixture.installedArchive', providers.gradleProperty('localGameInstalledArchive').get()
        run.property 'p2wlan.gameFixture.installedSha256', providers.gradleProperty('localGameInstalledSha256').get()
        run.property 'p2wlan.gameFixture.installedUniversal', 'true'
    }
}
if (providers.gradleProperty('localGameFixture').isPresent()) {
    def fixture = sourceSets.create('localGameFixture')
    fixture.java.srcDirs new File(game, 'src/localGameFixture/java'), new File(game, 'src/localGameClientFixture/java'),
            new File(game, 'src/fixtureCommon/java'), layout.projectDirectory.dir('src/fixtureCommon/java'),
            layout.projectDirectory.dir('src/localGameClientFixture/java'), rootProject.file('../game-api-1.20.1/src/fixture/java')
    configurations.localGameFixtureImplementation.extendsFrom configurations.implementation
    fixture.compileClasspath += sourceSets.main.output + gameClient.output + gameClient.compileClasspath
    if (externalInstalled) installedRuntime(fixture)
    else fixture.runtimeClasspath += sourceSets.main.output + gameClient.output + gameClient.runtimeClasspath
    def runtime = externalInstalled ? installedFixture(fixture, 'LocalGameFixture',
            layout.projectDirectory.file('src/localGameFixture/resources/META-INF/mods.toml').asFile,
            layout.projectDirectory.file('src/localGameFixture/resources/pack.mcmeta').asFile) : fixture
    minecraft.runs.create('localGameFixtureServer') {
        parent minecraft.runs.server
        bindFixture(delegate, runtime, providers.gradleProperty('localGameServerDirectory').get(),
                providers.gradleProperty('localGameServerConfig').get())
        property 'terminal.jline', 'false'
        property 'terminal.ansi', 'false'
        mods { p2wlan_local_game_test { source runtime } }
    }
    minecraft.runs.create('localGameFixtureClient') {
        parent minecraft.runs.client
        bindFixture(delegate, runtime, providers.gradleProperty('localGameClientDirectory').get(),
                providers.gradleProperty('localGameClientConfig').get())
        if (providers.gradleProperty('integratedGameFixture').isPresent()) args '--username', 'IntegratedGuest'
        mods { p2wlan_local_game_test { source runtime } }
    }
}
if (providers.gradleProperty('integratedGameFixture').isPresent()) {
    if (!providers.gradleProperty('localGameFixture').isPresent()) throw new GradleException('INTEGRATED_FIXTURE_REQUIRES_LOCAL_GAME_FIXTURE')
    def fixture = sourceSets.create('integratedFixture')
    fixture.java.srcDirs new File(game, 'src/integratedFixture/java'), new File(game, 'src/fixtureCommon/java'),
            layout.projectDirectory.dir('src/fixtureCommon/java'), rootProject.file('../game-api-1.20.1/src/fixture/java')
    configurations.integratedFixtureImplementation.extendsFrom configurations.implementation
    fixture.compileClasspath += sourceSets.main.output + gameClient.output + gameClient.compileClasspath
    if (externalInstalled) installedRuntime(fixture)
    else fixture.runtimeClasspath += sourceSets.main.output + gameClient.output + gameClient.runtimeClasspath
    def runtime = externalInstalled ? installedFixture(fixture, 'IntegratedFixture',
            layout.projectDirectory.file('src/integratedFixture/resources/META-INF/mods.toml').asFile,
            layout.projectDirectory.file('src/integratedFixture/resources/pack.mcmeta').asFile) : fixture
    minecraft.runs.create('integratedFixtureClient') {
        parent minecraft.runs.client
        bindFixture(delegate, runtime, providers.gradleProperty('localGameServerDirectory').get(),
                providers.gradleProperty('localGameServerConfig').get())
        args '--username', 'IntegratedHost'
        mods { p2wlan_integrated_test { source runtime } }
    }
}
tasks.withType(JavaExec).matching { it.name.startsWith('run') }.configureEach {
    dependsOn tasks.named('verifyModJar')
    if (name.endsWith('Client') && System.getProperty('os.name').startsWith('Mac')) jvmArgs '-XstartOnFirstThread'
    if (externalInstalled) {
        // FG6 userdev runs use named Minecraft APIs; raw installed Universal
        // archives require the official production launcher with SRG APIs.
        doFirst { throw new GradleException('LEGACY_FORGE_INSTALLED_REQUIRES_PRODUCTION_RUNTIME') }
    }
}
