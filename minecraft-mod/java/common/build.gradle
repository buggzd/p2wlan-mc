plugins { id 'java-library' }

// All loader producers embed the same Java-17 portable bytecode.
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

dependencies {
    api 'com.google.code.gson:gson:2.8.0'
    testImplementation 'com.google.code.gson:gson:2.10'
    implementation 'net.java.dev.jna:jna:5.12.1'
}

configurations { gsonFloor }
dependencies { gsonFloor 'com.google.code.gson:gson:2.8.0' }
tasks.register('gsonCompatibilityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.main.output + sourceSets.test.output + configurations.gsonFloor
    mainClass = 'io.p2wlan.mc.common.JsonCompatibilityTests'
}
check.dependsOn gsonCompatibilityTest

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.common.ProtocolTests'
}
check.dependsOn protocolTest

tasks.register('codecInteropTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.common.CodecInteropTests'
    def probe = providers.gradleProperty('nativeProbe')
    if (probe.isPresent()) args(probe.get())
    doFirst {
        if (!probe.isPresent()) {
            throw new GradleException('Run minecraft-mod/tools/java.py interop to build the native codec peer')
        }
    }
}

