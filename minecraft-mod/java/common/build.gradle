plugins { id 'java-library' }

dependencies { api 'com.google.code.gson:gson:2.10.1' }

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.common.ProtocolTests'
}
check.dependsOn protocolTest

tasks.register('codecInteropTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.common.CodecInteropTests'
    def probe = providers.gradleProperty('nativeProbe')
    if (probe.isPresent()) args(probe.get())
    doFirst {
        if (!probe.isPresent()) {
            throw new GradleException('Run minecraft-mod/tools/java.py interop to build the native codec peer')
        }
    }
}

tasks.register('agentClientTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.p2wlan.mc.common.AgentClientTests'
    def probe = providers.gradleProperty('agentProbe')
    if (probe.isPresent()) args(probe.get())
    doFirst {
        if (!probe.isPresent()) throw new GradleException('Run minecraft-mod/tools/java.py interop')
    }
}
